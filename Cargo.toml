[package]
name = "signal-listener"
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/signal-listener"
publish = false
build = "build.rs"

[features]
default = []
datom = ["dep:datom-codec", "listener-library/datom", "signal/datom"]

[dependencies]
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
datom-codec = { git = "https://github.com/LiGoldragon/datom-codec", rev = "09a0526", optional = true }
listener-library = { git = "https://github.com/LiGoldragon/listener-library", rev = "5dbc60f59084a388bb0348d528b3da92bf53aedd", default-features = false }
signal = { git = "https://github.com/LiGoldragon/signal", rev = "4f5cbb9", default-features = false }
[build-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "2999292dc67c8608e54d32c333c550b29153cbff" }

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = "warn"
